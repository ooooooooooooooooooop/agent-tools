name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  lint:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install pyyaml jsonschema zstandard

      - name: Validate agent tooling repository
        run: python scripts/validate_repo.py --strict

      - name: Run Skill quality gate
        run: python skills/skill-quality-gate/scripts/quality_report.py --root . --strict

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !registry/inventory/apply-backups/**
            !output/**
            !.claude/**

      - name: Check Python syntax
        shell: bash
        run: |
          find . -name "*.py" -not -path "./__pycache__/*" -not -path "*/__pycache__/*" | while read f; do
            echo "Checking $f"
            python -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done

      - name: Validate skills.json
        run: python -c "import json; json.load(open('skills.json', encoding='utf-8'))"

      - name: Validate mcp.json
        run: python -c "import json; json.load(open('mcp.json', encoding='utf-8'))"

      - name: Run repository regression tests
        run: python -m unittest discover -s tests -v > ci-test-output.txt 2>&1

      - name: Dump test log on failure
        if: failure()
        run: |
          Select-String -Path ci-test-output.txt -Pattern '^\S*(Error|Exception|Interrupt|Exit|Denied|Missing|NotFound|Failed|Expired|Timeout|Refused)\w*\s*:' | Select-Object -First 45 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          Select-String -Path ci-test-output.txt -Pattern 'File ".*tests.*test_aic_apply.*", line' | Select-Object -First 20 | ForEach-Object { Write-Output "::error::CTX $($_.Line)" }

      - name: Run Agent Switchboard MCP regression tests
        run: python -m unittest discover -s mcp/agent-switchboard/tests -v > ci-mcp-test-output.txt 2>&1

      - name: Dump MCP test log on failure
        if: failure()
        run: |
          Select-String -Path ci-mcp-test-output.txt -Pattern '^\S*(Error|Exception|Interrupt|Exit|Denied|Missing|NotFound|Failed|Expired|Timeout|Refused)\w*\s*:' | Select-Object -First 45 | ForEach-Object { Write-Output "::error::$($_.Line)" }

      - name: Run portable elite-experts smoke tests
        run: python skills/simulate-elite-experts/scripts/run_examples.py

      - name: Run structural skill evals
        run: python scripts/run_skill_evals.py

      - name: Verify local pre-commit hook installs and passes
        shell: bash
        run: |
          bash -n .githooks/pre-commit
          git config core.hooksPath .githooks
          chmod +x .githooks/pre-commit
          set -o pipefail
          ./.githooks/pre-commit 2>&1 | tee ci-hook-output.txt

      - name: Dump hook log on failure
        if: failure()
        run: |
          Select-String -Path ci-hook-output.txt -Pattern '^== .* ==$' | ForEach-Object { Write-Output "::notice::PHASE $($_.Line)" }
          Select-String -Path ci-hook-output.txt -Pattern '^\S*(Error|Exception|Interrupt|Exit|Denied|Missing|NotFound|Failed|Expired|Timeout|Refused)\w*\s*:|FAIL:|ERROR:' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          Get-Content ci-hook-output.txt -Tail 25 | ForEach-Object { Write-Output "::error::TAIL $($_.Line)" }
