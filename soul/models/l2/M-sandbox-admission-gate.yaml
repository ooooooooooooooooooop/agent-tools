model_id: M-sandbox-admission-gate
classification:
  level: SANITIZED
  basis:
  - declassification derivative of PRIVATE model
  derived_from: model:M-sandbox-admission-gate @ pilot canonical
  redaction_manifest:
  - machine-specific absolute paths generalized to <workspace>/<temp>
  - session ids and prediction ids removed (ephemeral provenance, not semantic content)
  - episode_refs generalized
  approver: u1-review:operator
  destination: public-release
proposition: In headless/agent sandboxed shells, commands can be rejected at a Windows
  ACL temp-root preflight before process creation when the effective temp root is
  inside the workspace; caller-supplied TEMP/TMP does not rebind the effective config.
  A missing command output under this gate is non-diagnostic of the target binary.
epistemic_status: provisional
scope:
- sandboxed shell execution layer
scope_conditions:
- Windows ACL temp-root gate active
- effective temp root inside workspace
confidence: medium
confidence_basis: 'three independent mechanical episodes: two Node version probes
  and one non-Node echo all rejected pre-execution; caller TEMP/TMP override did not
  change the effective config'
counterevidence: []
known_exceptions:
- does not diagnose target binary availability/version — only the admission layer
falsifier: a mechanically verified command reaches process creation and emits runtime
  output under the same effective temp-root config
promotion_criteria:
- controlled run with effective temp root outside workspace shows gate passable or
  confirms binding failure
evidence_summary:
  independence_groups: 2
  verdicts: refuted x2 + probe confirmed x2 (non-Node echo; caller TEMP override)
abstraction_level: L2
