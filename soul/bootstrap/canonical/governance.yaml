u0_constitutional:
  root_authorities:
    entity_root: REPLACE_ME
    normative_authority_root: owner
    emergency_stop: owner
    canonical_write: u1_governed
    body_binding: u1_governed
    declassification_ceiling: authority_review
  revision_rules:
  - predict-before-change
  - no post-change self-grant of authority
  - no retroactive legitimization
  - preserve prior U0 + lineage + rollback
  revision_threshold: higher for root-authority changes
u1_evolvable:
  update_classes:
    world_model: proposal->validation->accept->rollback-capable
    value_model: proposal->validation->canary->accept
    governance: proposal->validation->canary->accept
    schema: proposal->validation->E2->accept
  policies: []
normative_authorities:
  owner:
    scopes:
    - task_goal
    - project_goal
    - execution_permission
    - durable_value
  note: epistemic reliability never derives normative authority
policy_version: '1.1'
