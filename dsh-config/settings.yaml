ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: cc
llm-pi-ai:
  providers:
    opencode-go:
      apiKeyEnv: OPENCODE_GO_API_KEY
    kimi-coding:
      apiKeyEnv: KIMI_CODING_API_KEY
    bai:
      apiKeyEnv: BAI_API_KEY
      api: openai-completions
      baseURL: https://api.b.ai/v1/
      retryPolicy:
        mode: normal
        maxRetries: 10
        # 400/INVALID_REQUEST 不在 retryableCodes 中 => 不重试，直接修复
        retryableCodes: [ EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT ]
        backoff:
          initialDelayMs: 3000
          maxDelayMs: 180000
          jitterRatio: 0.3
      models:
        - id: deepseek-v4-flash
          compat:
            requiresReasoningContentOnAssistantMessages: true
            thinkingFormat: deepseek
            supportsDeveloperRole: false
            supportsReasoningEffort: false
          reasoningEfforts:
            high: high
    any:
      apiKeyEnv: ANY_API_KEY
      api: anthropic-messages
      baseURL: https://anyrouter.top
      headers:
        # AnyRouter gates all Claude models behind its 1M-context opt-in. Without
        # this beta token it returns 400 "1m 上下文已经全量可用，请启用 1m 上下文后重试".
        # The full Claude Code beta list mirrors the community pi-anyrouter package.
        anthropic-beta: claude-code-20250219,context-1m-2025-08-07,interleaved-thinking-2025-05-14,thinking-token-count-2026-05-13,context-management-2025-06-27,prompt-caching-scope-2026-01-05,mid-conversation-system-2026-04-07,effort-2025-11-24
      models:
        - id: claude-opus-5
          name: opus5
          contextWindow: 1000000
          input: [ text, image ]
    cpa:
      apiKeyEnv: CPA_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:8317/v1
      models:
        - id: gemini-3.7-flash-high
          input: [ text, image ]
        - id: claude-sonnet-4-6
          input: [ text, image ]
        - id: gpt-image-2
          input: [ text, image ]
        - id: claude-opus-4-6-thinking
          input: [ text, image ]
        - id: gpt-5.6-luna-max
          input: [ text, image ]
        - id: gpt-5.6-sol-xhigh
          input: [ text, image ]
agent-default-model:
  provider: bai
  model: deepseek-v4-flash
  reasoningEffort: high
