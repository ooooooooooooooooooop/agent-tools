# ============================================================================
# autonomous-execution-governor：DSH 侧 AUTONOMOUS_EXECUTION_GOVERNANCE 运行时 adapter
#
# 用法：把下面的条目合并进 <你的DSH profile>/cordis.patch.yml
#   （如 ~/.dsh/profiles/web/cordis.patch.yml），并把插件文件
#   autonomous-execution-governor.mjs 复制到同 profile 的 plugins/ 目录。
#
# 前提：预算投影由 AIC 生成（generated state，禁手改）：
#   aic apply dsh  →  ~/.dsh/governance/execution-profiles.generated.json
#   未生成时插件退化为观察模式（只写 audit，不拒绝任何调用）。
#
# 强制指定任务才能启用硬门禁（profile 可省略 → 自动 admission）：
#   config.taskId + 可选 config.objective / config.profile
#   （或环境变量 AE_GOV_TASK_ID / AE_GOV_OBJECTIVE / AE_GOV_PROFILE）。
#   - taskId 声明 = "这是 autonomous task"：profile 自动确定（UNKNOWN → safe default
#     AUTONOMOUS_STANDARD），绝不进入无约束观察模式。
#   - 无 taskId（普通会话）= 零副作用观察（非 autonomous 义务）。
#   checkpointScript：scripts/autonomy/checkpoint.py 绝对路径。
#   admissionScript：scripts/autonomy/profile_admission.py 绝对路径（部署时配置；
#   发布包本身不含本机路径）。
#
# 依据：registry/autonomous-execution-governance.yaml#profile_admission（canonical）
#   + harnesses/dsh.yaml governance_hooks 矩阵。
# ============================================================================

- insert:
  - id: autonomous-execution-governor
    name: './plugins/autonomous-execution-governor.mjs'
    config:
      taskId: null            # 声明 = autonomous task；缺省 = 零副作用观察
      profile: null           # 可省略：自动 admission（UNKNOWN → AUTONOMOUS_STANDARD）
      objective: null         # 任务目标（供 classifier；缺省 = safe default）
      projectId: null
      autoAdmit: true
      checkpointScript: null  # 部署时填 scripts/autonomy/checkpoint.py 绝对路径
      admissionScript: null   # 部署时填 scripts/autonomy/profile_admission.py 绝对路径