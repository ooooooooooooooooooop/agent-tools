# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Removed 2026-08-20: llm-overflow-classifier and llm-retry-claude-code plugins.
# dsh-llm rc.7 ships both fixes natively (INPUT_TOKEN_EXCEED_LIMIT classification
# in isContextWindowExceededError, and Claude Code baseline retry defaults), so
# the user plugins were redundant. Plugin files deleted from plugins/ dir.

# INACTIVE FILES in plugins/ (verified 2026-08-28, integrity audit): the four
# files below exist on disk but are NOT registered anywhere (no reference in
# this patch, cordis.yml, or deployment bundle yml), therefore never loaded.
# Decision: KEEP-inactive — they have no repo-side source and may be WIP;
# do not register without a deliberate behavior-change review.
#   - compaction-summarization-fallback.mjs
#   - session-supervisor.mjs
#   - session-surface-repair.mjs
#   - web-search-adapter.js   (repo source exists: agent-tools dsh/web-search-adapter)

# MCP: agent-switchboard (local cross-agent broker from {{DESKTOP}}\skills\mcp).
# Host-plane row: registers tools as mcp__agent-switchboard__* for every session.
# Reload marker: 2026-08-19 — force HMR respawn onto merged v1.0.33 code.
- insert:
  - id: research-lab-adapter
    name: '@research-lab/dsh-adapter'
    config:
      python: 'python'
      workspace: '{{DESKTOP}}\\research-lab\\demo-ws2'
      workspaceId: 'research-lab'
      deviceId: 'desktop'
  - id: mcp-agent-switchboard
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      transport: stdio
      serverName: agent-switchboard
      command: python
      args:
        - '{{DESKTOP}}\skills\mcp\agent-switchboard\agent_broker_mcp.py'
      cwd: '{{DESKTOP}}\skills\mcp\agent-switchboard'
      env:
        PYTHONUTF8: '1'
        PYTHONIOENCODING: 'utf-8'
        DSH_BROKER_RELOAD: '20260819-1058'
      toolCallTimeoutMs: 200000
      failOnStartupError: false

# Subagent context summarization (2026-08-22): fork 子代理不再全量复制父会话
# 历史，超过 30k 字符时注入「父会话摘要（复用 compaction summary）+ 最近一轮」。
# 阈值与保留轮数可调：thresholdChars / tailTurns。
- insert:
  - id: dsh-subagent-context-summary
    name: './plugins/dsh-subagent-context-summary.js'
    config:
      thresholdChars: 30000
      tailTurns: 1

# Subagent usage observer (2026-08-24): 只读工具 subagent_usage /
# subagent_stalled_check，从子代理会话日志查询模型、token、工具与空转判定。
- insert:
  - id: subagent-usage-observer
    name: './plugins/subagent-usage-observer-v1.mjs'

# Subagent splice summarizer (2026-08-24): 超长子代理文本报告有损压成结构化
# 摘要（保留 status/changed/validation/blocker/artifact 字段），非文本块原样保留。
- insert:
  - id: subagent-splice-summarizer
    name: './plugins/subagent-splice-summarizer-v1.mjs'
    config:
      thresholdChars: 8000

# Subagent PREP/EXEC gate (2026-08-25): 连续 >=6 个调查类 subagent 且无执行类时，
# 向模型注入可见警告（准备压倒执行守卫，subagent 通道版）。
- insert:
  - id: subagent-prep-exec-gate
    name: './plugins/subagent-prep-exec-gate.mjs'
    config:
      warnPrep: 6
- insert:
  - id: model-persona
    name: './plugins/model-persona.js'


# DSH compaction-convergence overlay (pinned local package at ./plugins/dsh-compaction-convergence).
# The upstream web bundle disables its host-plane compaction row, so keep that row disabled
# and mount the compatible local implementation under its own loader id. insert appends;
# reusing compaction-basic here would create a duplicate loader entry instead of an overlay.
# Managed by dsh/compaction-convergence/test/guard-convergence.ps1.

# DSH context-pressure guard overlay.
# Managed by dsh/context-pressure-guard/test/install-guard.ps1.

# AIC DSH RUNTIME COMPOSITION BEGIN
- id: compaction-basic
  disabled: true
- id: token-meter
  disabled: true
- id: agent-loop
  disabled: true
- insert:
  - id: token-meter-pressure-guard
    name: ./plugins/dsh-token-meter-pressure-guard/lib/index.js
  - id: agent-loop-pressure-guard
    name: ./plugins/dsh-agent-loop-pressure-guard/lib/index.js
    config:
      contextAdmission:
        safetyMargin: 16384
        operationalMaxOutput: 65536
        inputMultiplier: 1.08
        routes:
        - provider: opencode-go
          model: deepseek-v4-flash
          providerAttestedLimit: 1048576
  - id: tool-result-pruner-pressure-guard
    name: ./plugins/dsh-tool-result-pruner-pressure-guard/lib/index.js
    config:
      thresholdChars: 8192
      headChars: 4096
      tailChars: 1024
  - id: compaction-basic-convergence
    name: ./plugins/dsh-compaction-convergence/lib/index.js
    config:
      summarizationProvider: cpa
      summarizationModel: gemini-3.7-flash-high
      maxTokens: 2048
      maxOverflowRetries: 2
      maxConsecutiveFailures: 3
  - id: context-lifecycle
    name: ./plugins/dsh-context-lifecycle/lib/index.js
    config:
      archiveThresholdTokens: 800000
      sidecarDir: ./.dsh-context-lifecycle
  - id: model-switch-controller
    name: ./plugins/dsh-model-switch-controller/lib/index.js
    config:
      safetyMargin: 16384
      requiredOutputBudget: 65536
      inputMultiplier: 1.08
      conservativeFallbackLimit: 262144
      maxCompactionAttempts: 2
# AIC DSH RUNTIME COMPOSITION END
