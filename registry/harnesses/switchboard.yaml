# switchboard.yaml — agent-switchboard tool adapter contract（canonical · OPTIONAL TOOL）
# 定位：可选跨模型互操作工具包（非中央强制控制面；不向三方 Harness 安装强制 Hook）
harness: switchboard
home: ".agent-broker"
status: optional_tool
version_observed: "config.json schema 2026-08-28"

consumes:
  - registry/routing-policy.yaml
  - registry/models.yaml

render_targets: []

overlay:
  - "config.json: local paths, model settings, and tool configuration are local"

static_instructions:
  file: AGENT_GROUND_RULES.md
  owner: user
  legality: "Local tool ground rules"

runtime_context_hook:
  mechanism: "none (optional tool invoked on demand)"
  constraint: "No mandatory runtime hooks installed in other harnesses"

health_check: "MCP server startable on demand"
runtime_state: "state.sqlite topics/ supervisors/ *-inbox/ routing-gate/ agent-broker.log"
secret: "config.json api_key"

governance_hooks: {}
