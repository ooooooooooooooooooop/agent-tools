# harnesses/dsh.yaml — DSH adapter 契约（canonical）
# 边界：本文件只声明"哪些配置的哪些字段由 canonical 生成/校验"；其余内容属 overlay 或 harness 自有。
harness: dsh
schema_version: 3
consumes:
  - personal-ai-state:state/preferences.md#CONTINUOUS_CAPABILITY_ADOPTION
render_targets:
  - id: settings
    path: "{{DSH_HOME}}/settings.yaml"
    mode: full-file
    sections:
      "llm-pi-ai.providers": "registry/providers.yaml#providers"
      "agent-default-model": "overlay (user-owned; preserve admitted provider/model tuple, canonical main_default fallback when missing/invalid)"
      "agent-presets": "overlay"
      "ui-onboarding": "overlay"
      "llm-deepseek": "overlay"
  - id: continuous-capability-adoption
    path: "{{DSH_HOME}}/AGENTS.md"
    mode: managed-instruction-block
    source: "personal-ai-state/state/preferences.md#CONTINUOUS_CAPABILITY_ADOPTION"
    owner: aic
    note: "GENERATED projection；preferences.md 是唯一 canonical；只改带 checksum marker 的块"
  - id: autonomous-execution-governance
    path: "{{DSH_HOME}}/AGENTS.md"
    mode: managed-instruction-block
    source: "registry/autonomous-execution-governance.yaml#generated_instructions"
    owner: aic
    note: "AUTONOMOUS_EXECUTION_GOVERNANCE 硬规则投影（同一 AGENTS.md，第二块）；只改带 checksum marker 的块"
  - id: governance-profiles
    path: "{{DSH_HOME}}/governance/execution-profiles.generated.json"
    mode: full-file-json
    source: "registry/execution-profiles.yaml#profiles (projected deterministic subset)"
    owner: aic
    note: "DSH runtime governor 插件消费的预算投影（generated，禁手改）；diff/apply 全文件"
  - id: agent-preset-cc
    path: "{{DSH_HOME}}/.agent-presets/cc/agent.cordis.yml"
    mode: field-projection
    note: "preset 结构与工具组合属 harness overlay；此处只校验路由相关字段（防硬编码漂移）"
    field_checks:
      - {row: tool-subagent, key: config.agentOptions.provider, value_from: rules.subagent_spawn.provider}
      - {row: tool-subagent, key: config.agentOptions.model, value_from: rules.subagent_spawn.model}
      - {row: tool-subagent-fork, key: config.agentOptions.provider, value_from: rules.subagent_fork.provider}
      - {row: tool-subagent-fork, key: config.agentOptions.model, value_from: rules.subagent_fork.model}
      - {row: compaction-basic, key: config.summarizationProvider, value_from: rules.compaction_summary.provider}
      - {row: compaction-basic, key: config.summarizationModel, value_from: rules.compaction_summary.model}
# AIC_OPAQUE_PATH_VISIBILITY（已关闭）：所有 cordis !!js opaque 字段必须显式登记于此。
# 新增 opaque 而未登记 => aic diff dsh 报 <opaque> drift（silent growth 检测）。
opaque_paths:
  - {path: "[tool-bash].disabled", reason: "cordis-js-expression (!!js -> runtime 表达式)", owner: "dsh-agent-preset-cc"}
  - {path: "[tool-pwsh].disabled", reason: "cordis-js-expression (!!js -> runtime 表达式)", owner: "dsh-agent-preset-cc"}
  - {path: "[skill-filesystem].config.customSkillDirs[0]", reason: "cordis-js-expression (!!js -> baseUrl 相对路径计算)", owner: "dsh-agent-preset-cc"}
out_of_scope:
  - "会话/skills/hooks 等非模型路由面"

# Runtime composition is part of the DSH adapter contract.  It deliberately
# lives here, instead of in a second deployment registry: `aic apply dsh` is
# the only writer for the managed composition below.
runtime_composition:
  id: dsh-context-lifecycle
  profile:
    relative_to_dsh_home: profiles/web
    patch_file: cordis.patch.yml
    manifest_file: dsh-runtime-composition.json
    launcher_file: dsh-launch-web.ps1
    base_distribution_file: base-distribution.json
  node:
    version: v22.19.0
    relative_to_dsh_home: runtime/node-v22.19.0-win-x64
    archive:
      windows-x64:
        url: https://nodejs.org/dist/v22.19.0/node-v22.19.0-win-x64.zip
        sha256: ea3fad0e67a991d8477d8c01344b56e69c676ccb733f065b22436994b1253f86
  base:
    package: '@deepseek-ai/dsh'
    version: 0.1.1-rc.2
    install_mode: managed-profile-fixed-directory
    entry_relative_to_distribution: node_modules/@deepseek-ai/dsh/lib/bin.js
    patches:
      - id: directory-picker-win32-ipc
        target_relative: node_modules/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-host-directory-picker-native/lib/worker.cjs
        patch_file: dsh/runtime/directory-picker-win32-ipc.patch
        patch_sha256: 235284a75b815f522448c3a9ecc55e93cfec43ec2f763ca78ce32860a5c29170
  ui:
    repository: https://github.com/deepseek-ai/deepseek-harness.git
    # sourceState in the runtime manifest is immutable effective-build
    # provenance (commit plus any applied patch recipe). It is compared to
    # this desired recipe; source-checkout HEAD and dirty state are separate
    # evidence and must not be treated as runtime drift by themselves.
    baseline_commit: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
    fix_commit: 68826e9a6d8911239770016223719559c2842885
    fix_commit_remote: unavailable-at-audit
    apply_patch: false
    note: "从与固定 DSH base 0.1.1-rc.2 同版本的公开 release baseline 构建；跳过仅适用于未来 alpha UI 的补丁，禁止将不兼容源码混入 rc.2 基座。"
    patch_file: dsh/ui/deepseek-harness-68826e9.patch
    patch_sha256: 6b3d1f9bac533f6e9de06441b6916173b229afb0590c1adbfa53bfd712fc931e
    build_patch_file: dsh/ui/deepseek-harness-build-reproducibility.patch
    build_patch_sha256: 71ef402ec364faa2ae02ee42117d82daa1005861839b4f06d8cb913c7379e33b
    source_root_env: DSH_HARNESS_ROOT
    client_package: '@deepseek-ai/dsh-client-ui-conversation'
    client_bundle_relative: packages/client/ui-conversation/lib/client.js
    web_package: '@deepseek-ai/dsh-web-frontend'
    web_dist_relative: apps/web/dist
  compatibility:
    canonical_runtime_train: 0.1.1-rc
    host_package: '@deepseek-ai/dsh'
    host_version: 0.1.1-rc.2
    allow_mixed_train: false
    allow_cross_train_prerelease: false
    ownership:
      runtime_composition: aic
      user_settings: user
      harness_overlay: dsh-overlay
    groups:
      host_core:
        package_rules:
          '@deepseek-ai/dsh': ['0.1.1-rc']
          '@deepseek-ai/cordis': ['4.']
          '@deepseek-ai/cordis-plugin-timer': ['1.']
          '@deepseek-ai/cordis-plugin-hmr': ['1.']
          '@deepseek-ai/cordis-plugin-loader': ['1.']
