# AUTONOMOUS_EXECUTION_GOVERNANCE — DSH hook 矩阵（canonical；实现见 dsh/autonomous-execution-governor）
governance_hooks:
  BEFORE_MODEL_CALL: {impl: plugin, detail: "cordis tools.guard（dispatch 前，可 fail closed）"}
  AFTER_MODEL_CALL: {impl: plugin, detail: "token-meter / session telemetry 读取（cacheRead 可读）"}
  AFTER_AGENT_ACTION: {impl: plugin, detail: "guard 记录 tool+args hash"}
  ON_PROGRESS: {impl: plugin, detail: "mutation/artifact delta"}
  ON_CHECKPOINT: {impl: plugin, detail: "autonomous-execution-governor → checkpoint.py"}
  ON_BUDGET_LIMIT: {impl: plugin, detail: "guard FAIL CLOSED + checkpoint"}
  ON_NO_PROGRESS: {impl: plugin, detail: "loop breaker 警告 → circuit break"}
  ON_RESUME: {impl: tool, detail: "checkpoint.py resume"}
  native_reuse:
    - "goal 工具 max_goal_rounds（agent turn 上限，原生）"
    - "compaction + compaction-convergence guard（原生）"
    - "tool-call-timeout-policy（原生）"
    - "session checkpoint policy / persistence（原生）"
    - "subagent-usage-observer（cacheRead 记账，已有插件，复用）"
