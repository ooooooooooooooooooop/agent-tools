# gemini.yaml — Gemini CLI harness contract（canonical · NATIVE INDEPENDENT）
# Personal AI 管理范围：READ_ONLY_DISCOVERY ONLY（禁止 AIC 写控制 / 指令覆盖）
harness: gemini
home: ".gemini"
status: native_independent
version_observed: "0.56.0"

consumes: []
render_targets: []

overlay:
  - "All configuration in ~/.gemini/ is 100% user-owned and harness-native"

static_instructions:
  file: GEMINI.md
  owner: user
  legality: "Official native instructions only; no AIC or Switchboard managed blocks"

runtime_context_hook:
  mechanism: "none (harness native independent)"
  constraint: "Personal AI does not inject runtime hooks or instructions"

health_check: "gemini --version"
runtime_state: "projects.json, tmp/, history/ — 永不入 canonical"
secret: ".env / OAuth tokens — 永不入 canonical"

governance_hooks: {}
