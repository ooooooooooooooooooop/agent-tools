# providers.yaml — DSH provider 定义（canonical）
# 语义：与 ~/.dsh/settings.yaml 的 llm-pi-ai.providers 子树一一对应（渲染时机械映射）。
# TARGET BEHAVIOR = CURRENT BEHAVIOR：本阶段只无损描述现状，不做任何路由优化。
providers:
  opencode-go:
    apiKeyEnv: OPENCODE_GO_API_KEY
    models:
      - id: deepseek-v4-flash
        contextWindow: 1048576
        maxOutputTokens: 393216
        capabilityClass: TEXT_GENERATION
        capabilityEvidence:
          grade: authoritative
          source: "OpenCode route/model capability contract (authoritative evidence supplied 2026-09-02)"
          contextWindow: 1048576
          maxOutputTokens: 393216
  kimi-coding:
    apiKeyEnv: KIMI_CODING_API_KEY
    models:
      - id: k3-256k
        contextWindow: 262144
        outputSemantics: CONTEXT_REMAINDER
        capabilityClass: TEXT_GENERATION
        capabilityEvidence:
          grade: authoritative
          source: "https://platform.moonshot.cn/docs/pricing/chat"
          contextWindow: 262144
          outputSemantics: CONTEXT_REMAINDER
  bai:
    apiKeyEnv: BAI_API_KEY
    api: openai-completions
    baseURL: https://api.b.ai/v1/
    retryPolicy:
      mode: normal
      maxRetries: 10
      retryableCodes: [ EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT ]
      backoff:
        initialDelayMs: 3000
        maxDelayMs: 180000
        jitterRatio: 0.3
    models:
      - id: deepseek-v4-flash
        compat:
          requiresReasoningContentOnAssistantMessages: true
          thinkingFormat: deepseek
          supportsDeveloperRole: false
          supportsReasoningEffort: false
        reasoningEfforts:
          high: high
  any:
    apiKeyEnv: ANY_API_KEY
    api: anthropic-messages
    baseURL: https://anyrouter.top
    headers:
      anthropic-beta: claude-code-20250219,context-1m-2025-08-07,interleaved-thinking-2025-05-14,thinking-token-count-2026-05-13,context-management-2025-06-27,prompt-caching-scope-2026-01-05,mid-conversation-system-2026-04-07,effort-2025-11-24
    models:
      - id: claude-opus-5
        name: opus5
        contextWindow: 1000000
        input: [ text, image ]
  cpa:
    apiKeyEnv: CPA_API_KEY
    api: openai-completions
    baseURL: http://127.0.0.1:8317/v1
    models:
      - id: gemini-3.7-flash-high
        input: [ text, image ]
      - id: claude-sonnet-4-6
        input: [ text, image ]
      - id: gpt-image-2
        input: [ text, image ]
      - id: claude-opus-4-6-thinking
        input: [ text, image ]
      - id: gpt-5.6-luna-max
        input: [ text, image ]
      - id: gpt-5.6-sol-xhigh
        input: [ text, image ]
