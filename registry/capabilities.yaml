# capabilities.yaml — 跨 harness 标准能力定义（canonical · Capability Plane）
# 消费方：codex / gemini 等的 MCP 配置由此生成；harness 专有 MCP（node_repl、agent_switchboard）属各自 overlay。
capabilities:
  mcp_standard:
    memory:
      type: stdio
      command: cmd
      args: ["/c", "npx", "-y", "@modelcontextprotocol/server-memory"]
    sequential-thinking:
      type: stdio
      command: cmd
      args: ["/c", "npx", "-y", "@modelcontextprotocol/server-sequential-thinking"]
    time:
      type: stdio
      command: cmd
      args: ["/c", "npx", "-y", "@modelcontextprotocol/server-time"]
    context7:
      type: stdio
      command: cmd
      args: ["/c", "npx", "-y", "@upstash/context7-mcp"]
    fetch:
      type: stdio
      command: uvx
      args: ["mcp-server-fetch"]
  # harness-local capabilities（显式登记 + accepted 状态；capability_gov 比对依据）
  harness_local:
    agent_switchboard:
      harness_scope: codex
      status: accepted
      reason: "switchboard MCP 注入 codex（跨 agent 委派通道），属 harness-local overlay"
    node_repl:
      harness_scope: codex
      status: accepted
      reason: "codex 自带 node REPL 工具，harness-local"
