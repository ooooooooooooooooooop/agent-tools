# Portable overlay fragment for the persistent DSH Web profile.
- id: token-meter
  disabled: true
- id: agent-loop
  disabled: true
- insert:
  - id: token-meter-pressure-guard
    name: './plugins/dsh-token-meter-pressure-guard/lib/index.js'
  - id: agent-loop-pressure-guard
    name: './plugins/dsh-agent-loop-pressure-guard/lib/index.js'
    config:
      contextAdmission:
        safetyMargin: 16384
        operationalMaxOutput: 65536
        inputMultiplier: 1.08
        routes:
          - provider: 'opencode-go'
            model: 'deepseek-v4-flash'
            providerAttestedLimit: 1048576
  - id: tool-result-pruner-pressure-guard
    name: './plugins/dsh-tool-result-pruner-pressure-guard/lib/index.js'
    disabled: false
    config:
      thresholdChars: 8192
      headChars: 4096
      tailChars: 1024
  - id: context-lifecycle
    name: './plugins/dsh-context-lifecycle/lib/index.js'
    config:
      archiveThresholdTokens: 800000
      sidecarDir: './.dsh-context-lifecycle'
